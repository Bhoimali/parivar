<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>भोई माली समाज, राजसमंद</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="container">

    <h1>भोई माली समाज, राजसमंद</h1>

    <div class="card">

      <h2>Login</h2>

      <input
        type="text"
        id="loginPid"
        placeholder="PID / Email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button onclick="loginUser()">
        Login
      </button>

      <div id="loginMessage"></div>

    </div>


    <div
      id="userPanel"
      class="card"
      style="display:none;"
    >

      <h2>Account</h2>

      <div id="userInfo"></div>

      <button onclick="loadMembers()">
        Family Members
      </button>

      <div id="members"></div>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
