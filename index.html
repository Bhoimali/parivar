<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BhoiMali-Parivar</title>

<link rel="icon" type="image/jpg"
href="https://drive.google.com/thumbnail?id=1dP2JVtOM3sIpSUWKPmI2HoxryBbj0P-6">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* =========================
   IFRAME
========================= */
iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  margin-top:-40px;
}

/* =========================
   LOADER
========================= */
#loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #ffffff;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  transition: opacity 0.4s ease, visibility 0.4s ease;
}

/* Loader hide */
#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Spinner */
.spinner {
  width: 55px;
  height: 55px;

  border: 5px solid #e5e5e5;
  border-top: 5px solid #0d6efd;
  border-radius: 50%;

  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

/* Loading Text */
.loading-text {
  margin-top: 18px;
  font-size: 17px;
  font-weight: 600;
  color: #333;
}

/* Small dots animation */
.dots::after {
  content: "";
  animation: dots 1.5s infinite;
}

@keyframes dots {
  0%   { content: ""; }
  25%  { content: "."; }
  50%  { content: ".."; }
  75%  { content: "..."; }
  100% { content: ""; }
}
</style>
</head>

<body>

<!-- =========================
     LOADER
========================= -->
<div id="loader">
  <div class="spinner"></div>

  <div class="loading-text">
    लोड हो रहा है<span class="dots"></span>
  </div>
</div>


<!-- =========================
     GOOGLE APPS SCRIPT IFRAME
========================= -->
<iframe
  id="appFrame"
  src="https://script.google.com/macros/s/AKfycbyBjAHlbVGbX0V7sLsiJjX472OBysAfdlVX4CdpuEAtRlXu4Vj0dAF9GzVm7PtT-fs/exec"
  allow="fullscreen">
</iframe>


<script>
const iframe = document.getElementById("appFrame");
const loader = document.getElementById("loader");

/*
 * Iframe load होने के बाद loader हटाएँ
 */
iframe.addEventListener("load", function () {

  // थोड़ी smooth delay ताकि page अचानक न दिखे
  setTimeout(function () {
    loader.classList.add("hide");
  }, 300);

});
</script>

</body>
</html>
