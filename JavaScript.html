    // Show/hide loader

    function hideLoader() {

    }
    
    // File upload handling
    function LoadFile(event) {
      var file = event.target.files[0];
      if (!file) return;
      
      var reader = new FileReader();
      reader.onload = function(e) {
        var fileData = e.target.result.substring(e.target.result.indexOf(",") + 1);
        var mimeTypeStart = e.target.result.indexOf("data:") + 10;
        var mimeTypeEnd = e.target.result.indexOf(";");
        var mimeType = e.target.result.substring(mimeTypeStart, mimeTypeEnd);
        var fileName = file.name;
        
        document.getElementById("fileData").value = fileData;
        document.getElementById("mimeType").value = mimeType;
        document.getElementById("fileName").value = fileName;
        
        // Show file preview
        document.getElementById('filePreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

          let objRecord = { recordId: recordId, key: permanenKey };

function blockSpace(e){

  }
}




function togglePassword(id, icon){
  const input = document.getElementById(id);

  if(input.type === "password"){
    input.type = "text";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  }
}
